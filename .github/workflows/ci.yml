name: Build miniforge
on: 
  push:
    branches:
      - main
    tags:
      - '**'
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  build:
    name: Miniforge3-${{ matrix.OS_NAME }}-${{ matrix.ARCH }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            ARCH: x86_64
            TARGET_PLATFORM: win-64
            OS_NAME: "Windows"
            TEST_OFFLINE: true

          - os: macos-latest
            ARCH: arm64
            TARGET_PLATFORM: osx-arm64
            OS_NAME: "MacOSX"
            TEST_OFFLINE: true

          - os: macos-latest
            ARCH: x86_64
            TARGET_PLATFORM: osx-64
            OS_NAME: "MacOSX"

          - os: ubuntu-latest
            ARCH: aarch64
            TARGET_PLATFORM: linux-aarch64
            DOCKER_ARCH: arm64/v8
            DOCKERIMAGE: condaforge/linux-anvil-aarch64
            OS_NAME: "Linux"
            # Reduce the test matrix because the builds timeouts on emulated architectures
            # The time consuming operation is an attempt a full solve of conda/mamba/boa
            # for as a compatibility
            # xref https://github.com/conda-forge/miniforge/pull/361
            TEST_IMAGE_NAMES: "ubuntu:24.04"

          - os: ubuntu-latest
            ARCH: riscv64
            TARGET_PLATFORM: linux-riscv64
            DOCKER_ARCH: amd64
            DOCKERIMAGE: condaforge/linux-anvil-x86_64:alma10
            OS_NAME: "Linux"
            # No testing until docker image has been created
            TEST_IMAGE_NAMES: " "

          - os: ubuntu-latest
            ARCH: x86_64
            TARGET_PLATFORM: linux-64
            DOCKER_ARCH: amd64
            DOCKERIMAGE: condaforge/linux-anvil-cos7-x86_64
            OS_NAME: "Linux"
            TEST_OFFLINE: true

          - os: ubuntu-latest
            ARCH: ppc64le
            TARGET_PLATFORM: linux-ppc64le
            DOCKER_ARCH: ppc64le
            DOCKERIMAGE: condaforge/linux-anvil-ppc64le
            OS_NAME: "Linux"
            # Reduce the test matrix because the builds timeouts on emulated architectures
            # The time consuming operation is an attempt a full solve of conda/mamba/boa
            # for as a compatibility
            # xref https://github.com/conda-forge/miniforge/pull/361
            TEST_IMAGE_NAMES: "ubuntu:24.04"

    uses: ./.github/workflows/build.yml
    secrets: inherit
    with:
      os: ${{ matrix.os }}
      ARCH: ${{ matrix.ARCH }}
      TARGET_PLATFORM: ${{ matrix.TARGET_PLATFORM }}
      OS_NAME: ${{ matrix.OS_NAME }}
      DOCKER_ARCH: ${{ matrix.DOCKER_ARCH }}
      DOCKERIMAGE: ${{ matrix.DOCKERIMAGE }}
      TEST_IMAGE_NAMES: ${{ matrix.TEST_IMAGE_NAMES }}
      TEST_OFFLINE: ${{ matrix.TEST_OFFLINE || false }}
